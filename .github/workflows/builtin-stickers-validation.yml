name: Built-in sticker validation

on:
  push:
    branches: ["feature/builtin-sticker-library"]
    paths:
      - "index.html"
      - "circle-media-manager.js"
      - "sticker-library.js"
      - "backup-v4.js"
      - "tests/**"
      - "tools/verify-twodeers-hardening.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/builtin-stickers-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify current source syntax, sticker inventory and module wiring
        run: node tools/verify-twodeers-hardening.mjs
      - name: Run card-management transactional regressions
        run: node tests/card-management.test.mjs
