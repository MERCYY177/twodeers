name: Isolated restore lifecycle rehearsal

on:
  push:
    branches: [main]
    paths:
      - "tests/phase37-audit-fixes.test.mjs"
      - "PHASE37-CHANGELOG.md"
      - "index.html"
      - "*.js"
      - "assets/**"
      - "tests/isolated-application-fixtures.mjs"
      - "tests/isolated-application-fixtures.test.mjs"
      - "tests/isolated-restore-lifecycle-e2e.mjs"
      - "tests/phase28-restore-combined-failures.test.mjs"
      - "tests/backup-atomicity.test.mjs"
      - "tests/isolated-restore-crash-worker.mjs"
      - "tests/run-browser-with-evidence.mjs"
      - "tests/browser-evidence-runner.test.mjs"
      - "tests/browser-ci-contract.test.mjs"
      - ".github/workflows/isolated-restore-lifecycle.yml"
      - "tools/verify-twodeers-hardening.mjs"
      - "tests/browser-recovery-acceptance-matrix.test.mjs"
      - "docs/browser-recovery-acceptance-matrix.json"
      - ".github/workflows/browser-recovery-acceptance-matrix.yml"
      - "tests/chromium-v4-restore-crash-matrix.mjs"
      - "tests/chromium-v4-restore-crash-matrix.test.mjs"
      - "PHASE29-CHANGELOG.md"
      - "PHASE30-CHANGELOG.md"
      - "tests/phase31-restore-strict-durability.test.mjs"
      - "PHASE31-CHANGELOG.md"
      - "PHASE32-CHANGELOG.md"
      - "tests/phase33-ci-evidence-persistence.test.mjs"
      - "tests/phase34-chromium-process-group-cleanup.test.mjs"
      - "PHASE33-CHANGELOG.md"
      - "PHASE34-CHANGELOG.md"
      - "tests/phase36-profile-media-call-beautify.test.mjs"
      - "tests/phase36-call-transition-integrity.test.mjs"
      - "PHASE36-CHANGELOG.md"

  pull_request:
    paths:
      - "tests/phase37-audit-fixes.test.mjs"
      - "PHASE37-CHANGELOG.md"
      - "index.html"
      - "*.js"
      - "assets/**"
      - "tests/isolated-application-fixtures.mjs"
      - "tests/isolated-restore-lifecycle-e2e.mjs"
      - "tests/isolated-restore-crash-worker.mjs"
      - "tests/run-browser-with-evidence.mjs"
      - "tests/browser-evidence-runner.test.mjs"
      - ".github/workflows/isolated-restore-lifecycle.yml"
      - "tools/verify-twodeers-hardening.mjs"
      - "tests/isolated-application-fixtures.test.mjs"
      - "tests/browser-ci-contract.test.mjs"
      - "tests/browser-recovery-acceptance-matrix.test.mjs"
      - "docs/browser-recovery-acceptance-matrix.json"
      - ".github/workflows/browser-recovery-acceptance-matrix.yml"
      - "tests/phase28-restore-combined-failures.test.mjs"
      - "tests/backup-atomicity.test.mjs"
      - "tests/chromium-v4-restore-crash-matrix.mjs"
      - "tests/chromium-v4-restore-crash-matrix.test.mjs"
      - "PHASE29-CHANGELOG.md"
      - "PHASE30-CHANGELOG.md"
      - "tests/phase31-restore-strict-durability.test.mjs"
      - "PHASE31-CHANGELOG.md"
      - "PHASE32-CHANGELOG.md"
      - "tests/phase33-ci-evidence-persistence.test.mjs"
      - "tests/phase34-chromium-process-group-cleanup.test.mjs"
      - "PHASE33-CHANGELOG.md"
      - "PHASE34-CHANGELOG.md"
      - "tests/phase36-profile-media-call-beautify.test.mjs"
      - "tests/phase36-call-transition-integrity.test.mjs"
      - "PHASE36-CHANGELOG.md"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twodeers-phase18-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-restore-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: "true"
      TWODEERS_E2E_ARTIFACT_DIR: test-results/browser-e2e/phase18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize browser evidence directory
        run: |
          mkdir -p "$TWODEERS_E2E_ARTIFACT_DIR"
          {
            node --version
            npm --version
            uname -a
          } > "$TWODEERS_E2E_ARTIFACT_DIR/00-runner-environment.log" 2>&1

      - name: Install deterministic font fixture
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/01-font-apt-update.log"
          sudo apt-get install -y fonts-dejavu-core 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/02-font-install.log"

      - name: Install pinned Playwright driver
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.0 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/03-playwright-npm-install.log"

      - name: Install Chromium and system dependencies
        run: |
          set -o pipefail
          node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/04-chromium-install.log"

      - name: Test browser evidence runner
        run: |
          set -o pipefail
          node tests/browser-evidence-runner.test.mjs 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/05-evidence-runner-self-test.log"

      - name: Run isolated restore lifecycle Chromium rehearsal with evidence capture
        run: node tests/run-browser-with-evidence.mjs phase18

      - name: Run complete source hardening regression
        run: node tools/verify-twodeers-hardening.mjs

      - name: Upload restore lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-phase18-restore-evidence-${{ github.run_id }}
          path: |
            test-results/browser-e2e/phase18/
            test-results/browser-e2e/phase31/
          if-no-files-found: warn
          retention-days: 14


  v4-restore-crash-matrix:
    # Independent from the Phase 18 browser rehearsal so an unrelated Phase 18
    # failure or timeout cannot prevent the six V4 SIGKILL checkpoints from running.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      TWODEERS_E2E_ARTIFACT_DIR: test-results/browser-e2e/phase33
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize independent V4 crash-matrix evidence directory
        run: |
          mkdir -p "$TWODEERS_E2E_ARTIFACT_DIR"
          {
            echo "workflow_job=v4-restore-crash-matrix"
            echo "github_run_id=$GITHUB_RUN_ID"
            node --version
            npm --version
            uname -a
          } > "$TWODEERS_E2E_ARTIFACT_DIR/00-runner-environment.log" 2>&1

      - name: Install deterministic distinct font fixtures
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/01-font-apt-update.log"
          sudo apt-get install -y fonts-dejavu-core 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/02-font-install.log"
          sha256sum /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf | tee "$TWODEERS_E2E_ARTIFACT_DIR/02-font-fixture-sha256.log"

      - name: Install pinned Playwright Chromium resolver
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.0 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/03-playwright-npm-install.log"

      - name: Install isolated Chromium and operating-system dependencies
        id: install_chromium
        run: |
          set -o pipefail
          node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/04-chromium-install.log"
          node -e "import('playwright').then(({chromium})=>console.log('playwright Chromium executable:',chromium.executablePath()))" | tee "$TWODEERS_E2E_ARTIFACT_DIR/04-chromium-path.log"

      - name: Run V4 crash-matrix and process-group cleanup contracts
        id: crash_matrix_contract
        run: |
          set -o pipefail
          node tests/chromium-v4-restore-crash-matrix.test.mjs 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/05-crash-matrix-contract.log"
          node tests/phase34-chromium-process-group-cleanup.test.mjs 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/05-process-group-cleanup-contract.log"

      - name: Run six real Chromium V4 SIGKILL and same-profile recovery checkpoints
        if: ${{ always() && steps.install_chromium.outcome == 'success' && steps.crash_matrix_contract.outcome == 'success' }}
        run: |
          set -o pipefail
          node tests/chromium-v4-restore-crash-matrix.mjs 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/06-real-chromium-crash-matrix.log"

      - name: Run complete source hardening regression
        if: always()
        run: |
          set -o pipefail
          node tools/verify-twodeers-hardening.mjs 2>&1 | tee "$TWODEERS_E2E_ARTIFACT_DIR/07-source-hardening.log"

      - name: Upload independent V4 crash-matrix evidence and failed profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-v4-crash-matrix-evidence-${{ github.run_id }}
          path: test-results/browser-e2e/phase33/
          if-no-files-found: warn
          retention-days: 14
