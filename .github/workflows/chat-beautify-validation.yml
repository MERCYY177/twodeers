name: Chat beautification validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "chat-beautify-presets.js"
      - "chat-beautify-manager.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "appearance-manager.js"
      - "sticker-library.js"
      - "sticker-admin.js"
      - "settings-pages.js"
      - ".github/workflows/chat-beautify-validation.yml"
  push:
    branches:
      - feat/faithful-bubble-css-migration
      - "fix/**"
    paths:
      - "chat-beautify-presets.js"
      - "chat-beautify-manager.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "appearance-manager.js"
      - ".github/workflows/chat-beautify-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify source and run Node tests
        run: |
          node tools/verify-source.mjs
          node --test tests/*.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run real-browser smoke and visual checks
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/twodeers-http.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/index.html > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.mjs
          kill "$SERVER_PID" || true
      - name: Package modified source
        if: always()
        run: |
          git archive --format=zip --output=twodeers-sticker-management-center-20261106.zip HEAD
      - name: Upload modified source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-sticker-management-center-20261106
          path: twodeers-visitors-minute-intervals-20261106.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload desktop/mobile screenshots and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-beautification-browser-evidence
          path: artifacts/chat-beautify/
          if-no-files-found: warn
          retention-days: 14
