name: Chat beautification validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "chat-beautify-presets.js"
      - "chat-beautify-manager.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "circle-media-manager.js"
      - "appearance-manager.js"
      - ".github/workflows/chat-beautify-validation.yml"
  push:
    branches:
      - feat/faithful-bubble-css-migration
      - "fix/**"
    paths:
      - "chat-beautify-presets.js"
      - "chat-beautify-manager.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "circle-media-manager.js"
      - "appearance-manager.js"
      - ".github/workflows/chat-beautify-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify current source and existing deterministic regressions
        run: |
          node --check chat-beautify-presets.js
          node --check chat-beautify-manager.js
          node tools/verify-twodeers-hardening.mjs
          node tests/card-management.test.mjs
          node tests/runtime-consistency.test.mjs
          node tests/media-lifecycle.test.mjs
      - name: Package modified source
        if: always()
        run: |
          git archive --format=zip --output=twodeers-visitors-minute-intervals-20261106.zip HEAD
      - name: Upload modified source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-visitors-minute-intervals-20261106
          path: twodeers-visitors-minute-intervals-20261106.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload desktop/mobile screenshots and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-beautification-browser-evidence
          path: artifacts/chat-beautify/
          if-no-files-found: warn
          retention-days: 14
