name: Real browser multi-tab and crash recovery E2E

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "runtime-coordinator.js"
      - "backup-v4.js"
      - "circle-media-manager.js"
      - "custom-font-manager.js"
      - "mailbox-manager.js"
      - "sticker-library.js"
      - "font-panel.js"
      - "card-system.js"
      - "chat-beautify-manager.js"
      - "tests/browser-runtime-e2e.mjs"
      - "tests/runtime-recovery.test.mjs"
      - ".github/workflows/browser-runtime-e2e.yml"
  pull_request:
    paths:
      - "index.html"
      - "runtime-coordinator.js"
      - "backup-v4.js"
      - "circle-media-manager.js"
      - "custom-font-manager.js"
      - "mailbox-manager.js"
      - "sticker-library.js"
      - "font-panel.js"
      - "card-system.js"
      - "chat-beautify-manager.js"
      - "tests/browser-runtime-e2e.mjs"
      - "tests/runtime-recovery.test.mjs"
      - ".github/workflows/browser-runtime-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright browser driver
        run: npm install --no-save --no-package-lock playwright@1.65.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check browser test syntax
        run: |
          node --check runtime-coordinator.js
          node --check tests/runtime-recovery.test.mjs
          node --check tests/browser-runtime-e2e.mjs
      - name: Run source-level coordinator tests
        run: node tests/runtime-recovery.test.mjs
      - name: Run real Chromium multi-tab and crash recovery E2E
        run: node tests/browser-runtime-e2e.mjs
