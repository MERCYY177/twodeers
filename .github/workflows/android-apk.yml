name: Android debug APKs

on:
  push:
    branches: [main, "feature/builtin-sticker-library", "build/android-apk-20261108"]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "android-apps/**"
      - "tools/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify current source package
        run: node tools/verify-twodeers-hardening.mjs
      - name: Build all four debug APKs
        working-directory: android-apps
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify four APK outputs
        working-directory: android-apps
        run: |
          count=$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)
          echo "APK count: $count"
          test "$count" -eq 4
          find app/build/outputs/apk -type f -name '*.apk' -print
      - name: Split APKs into verified transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/twodeers-apk-parts
          mkdir -p /tmp/twodeers-apk-parts
          for flavor in beibeilu lu1 lu2 lu3; do
            apk="android-apps/app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            split -b 75M -d --additional-suffix=.bin "$apk" "/tmp/twodeers-apk-parts/${flavor}-"
            cat /tmp/twodeers-apk-parts/${flavor}-*.bin > "/tmp/twodeers-apk-parts/${flavor}-reassembled.apk"
            cmp "$apk" "/tmp/twodeers-apk-parts/${flavor}-reassembled.apk"
            sha256sum "$apk" | tee "/tmp/twodeers-apk-parts/${flavor}.sha256"
          done
      - name: Upload 贝贝鹿 APK part 1
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-beibeilu-part-1
          path: /tmp/twodeers-apk-parts/beibeilu-00.bin
          if-no-files-found: error
          retention-days: 14
      - name: Upload 贝贝鹿 APK part 2
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-beibeilu-part-2
          path: /tmp/twodeers-apk-parts/beibeilu-01.bin
          if-no-files-found: error
          retention-days: 14
      - name: Upload 鹿1 APK part 1
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-lu1-part-1
          path: /tmp/twodeers-apk-parts/lu1-00.bin
          if-no-files-found: error
          retention-days: 14
      - name: Upload 鹿1 APK part 2
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-lu1-part-2
          path: /tmp/twodeers-apk-parts/lu1-01.bin
          if-no-files-found: error
          retention-days: 14
      - name: Upload 鹿2 APK part 1
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-lu2-part-1
          path: /tmp/twodeers-apk-parts/lu2-00.bin
          if-no-files-found: error
          retention-days: 14
      - name: Upload 鹿2 APK part 2
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-lu2-part-2
          path: /tmp/twodeers-apk-parts/lu2-01.bin
          if-no-files-found: error
          retention-days: 14
      - name: Upload 鹿3 APK part 1
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-lu3-part-1
          path: /tmp/twodeers-apk-parts/lu3-00.bin
          if-no-files-found: error
          retention-days: 14
      - name: Upload 鹿3 APK part 2
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-lu3-part-2
          path: /tmp/twodeers-apk-parts/lu3-01.bin
          if-no-files-found: error
          retention-days: 14
