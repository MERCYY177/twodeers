name: Android debug APKs

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "android-apps/**"
      - "tests/**"
      - "tools/**"
      - ".github/scripts/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "android-apps/**"
      - "tests/**"
      - "tools/**"
      - ".github/scripts/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apks-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify web source and V4 ZIP backup
        run: |
          node tools/verify-source.mjs
          node --test tests/backup-v4.test.mjs tests/chat-beautify.test.mjs
      - name: Install Playwright browser test
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/twodeers-http.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/index.html > /dev/null; then break; fi
            sleep 1
          done
          FONT_PATH="$(fc-match -f '%{file}' 'DejaVu Sans' | head -n 1)"
          TWODEERS_TEST_FONT="$FONT_PATH" node tests/browser-smoke.mjs
          node tests/theme-mode-smoke.mjs
          kill "$SERVER_PID" || true
      - name: Build all four debug APKs
        working-directory: android-apps
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify four APK outputs
        working-directory: android-apps
        run: |
          count=$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)
          echo "APK count: $count"
          test "$count" -eq 4
          find app/build/outputs/apk -type f -name '*.apk' -print
      - name: Verify Android system light and dark mode in all four app variants
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: ./android-apps
          # Keep the test loop in bash; this action invokes each script field with sh -c.
          script: bash ../.github/scripts/verify-android-system-theme.sh
      - name: Upload Android theme test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-theme-test-diagnostics
          path: |
            android-test-diagnostics/**
            android-apps/app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload four APKs
        uses: actions/upload-artifact@v4
        with:
          name: beibeilu-four-apks
          path: android-apps/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
