name: Android debug APKs

on:
  push:
    branches: [main, "feature/builtin-sticker-library", "build/android-apk-20261108"]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "android-apps/**"
      - "tools/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify current source package
        run: node tools/verify-twodeers-hardening.mjs
      - name: Build all four debug APKs
        working-directory: android-apps
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify four APK outputs
        working-directory: android-apps
        run: |
          count=$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)
          echo "APK count: $count"
          test "$count" -eq 4
          find app/build/outputs/apk -type f -name '*.apk' -print
      - name: Upload 贝贝鹿 APK
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-apk-beibeilu
          path: android-apps/app/build/outputs/apk/beibeilu/debug/app-beibeilu-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload 鹿1 APK
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-apk-lu1
          path: android-apps/app/build/outputs/apk/lu1/debug/app-lu1-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload 鹿2 APK
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-apk-lu2
          path: android-apps/app/build/outputs/apk/lu2/debug/app-lu2-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload 鹿3 APK
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-apk-lu3
          path: android-apps/app/build/outputs/apk/lu3/debug/app-lu3-debug.apk
          if-no-files-found: error
          retention-days: 14
