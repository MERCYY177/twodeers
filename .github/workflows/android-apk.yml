name: Android debug APKs

on:
  push:
    branches: [main, "feature/builtin-sticker-library"]
    paths:
      - "index.html"
      - "circle-media-manager.js"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "sticker-source/**"
      - "android-apps/**"
      - "tests/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg for HEIF conversion
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify current web source, card management and theme sync
        run: |
          node tools/verify-twodeers-hardening.mjs
          node tests/card-management.test.mjs
          node tests/appearance-theme.test.mjs
          node tests/runtime-consistency.test.mjs
          node tests/media-lifecycle.test.mjs
      - name: Build all four debug APKs
        working-directory: android-apps
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify four APK outputs
        working-directory: android-apps
        run: |
          count=$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)
          echo "APK count: $count"
          test "$count" -eq 4
          find app/build/outputs/apk -type f -name '*.apk' -print
      - name: Upload four APKs
        uses: actions/upload-artifact@v4
        with:
          name: beibeilu-four-apks
          path: android-apps/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
