name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "android-apps/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify web source and V4 ZIP backup
        run: |
          node tools/verify-source.mjs
          node --test tests/backup-v4.test.mjs
      - name: Build debug APK
        working-directory: android-apps
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: twodeers-debug-apk
          path: android-apps/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
